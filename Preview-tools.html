<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weezy | معاينة الموقع</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif;background:#09090b;color:#eee9dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#302a1b70,transparent 60%),#09090b;min-height:100vh}header{max-width:1100px;margin:auto;padding:25px 24px 16px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-family:Georgia,serif;font-size:26px;letter-spacing:2px}.brand small{display:block;font:9px Arial;letter-spacing:2.7px;margin-top:5px;color:#7f9bff}.intro{font-size:13px;color:#a6a49c;margin:0}.actions{max-width:1100px;margin:auto;display:flex;gap:9px;flex-wrap:wrap;padding:0 24px 18px}a,button{font:13px Arial;text-decoration:none;border:1px solid #7f9bff45;border-radius:99px;padding:11px 17px;color:#eee9dc;background:#181817;cursor:pointer}a.gold{background:#7f9bff;color:#111;font-weight:bold}button[aria-pressed=true]{border-color:#7f9bff;color:#7f9bff}.stage{margin:0 20px 20px;display:flex;justify-content:center;min-height:500px}iframe{background:#09090b;border:1px solid #7f9bff28;border-radius:13px;width:min(1450px,100%);height:calc(100vh - 170px);min-height:500px}.phone iframe{width:390px;height:844px;max-width:100%;border:8px solid #222;border-radius:30px;box-shadow:0 22px 65px #000}.phone{padding-bottom:24px}.note{font-size:12px;color:#aaa692;max-width:1100px;margin:0 auto 18px;padding:0 24px;line-height:1.7}@media(max-width:600px){header{align-items:flex-start;flex-direction:column;gap:10px}.brand{font-size:22px}.stage{margin-inline:10px}.actions{padding-inline:16px}.phone iframe{height:calc(100vh - 180px);min-height:590px}}
  </style>
</head>
<body>
  <header><div class="brand" dir="ltr">WEEZY<small>FRAGRANCE</small></div><p class="intro">معاينة تفاعلية للموقع ولوحة الإدارة</p></header>
  <div class="actions">
    <a class="gold" href="index.html#/" target="_blank">فتح الموقع كاملًا</a>
    <a href="index.html#/admin" target="_blank">فتح لوحة الأدمن</a>
    <button id="desktop" aria-pressed="false">واجهة الكمبيوتر</button>
    <button id="phone" aria-pressed="true">واجهة الهاتف</button>
    <a href="index.html?reset=1#/" id="reset">إعادة بيانات العرض</a>
  </div>
  <p class="note">البيانات والطلبات تجريبية وتُحفظ على هذا المتصفح فقط. لا يتم إرسال طلبات أو بريد إلى المتجر. جرّب كود الخصم <b dir="ltr">DEMO10</b>، ويمكنك تغيير المنتجات ونشرها من الأدمن.</p>
  <main class="stage phone" id="stage"><iframe src="index.html#/" title="معاينة موقع ويزي"></iframe></main>
  <script>
    const stage=document.getElementById('stage'),desktop=document.getElementById('desktop'),phone=document.getElementById('phone');
    function showPhone(value){stage.classList.toggle('phone',value);phone.setAttribute('aria-pressed',String(value));desktop.setAttribute('aria-pressed',String(!value));}
    desktop.onclick=()=>showPhone(false);phone.onclick=()=>showPhone(true);
    document.getElementById('reset').onclick=()=>confirm('إعادة بيانات العرض؟ سيتم حذف التعديلات والطلبات التجريبية على هذا المتصفح.');
  </script>
</body>
</html>
